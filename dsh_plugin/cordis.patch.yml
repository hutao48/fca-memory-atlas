# ============================================================================
# FCA Memory Atlas bridge — DSH bundle patch
# ============================================================================
# Inserts the single Host plugin row that connects DeepSeek Harness to the
# local FCA Local Runtime (http://127.0.0.1:17860 by default).
#
# A matching override replaces the complete `config`, so keep every setting
# this plugin reads in this block; defaults for omitted fields come from the
# plugin's exported Config schema (see src/config.js).
#
# Install (never hand-edit the profile's own cordis.patch.yml):
#   plugin_manager action=install_bundle target=<absolute path to this directory>
# ============================================================================
- insert:
    - id: fca-memory-bridge
      name: dsh-plugin-fca-memory
      config:
        # Local-only HTTP origin of the FCA Local Runtime.
        runtimeUrl: http://127.0.0.1:17860
        # Start runtime/bin/fca-runtime.js with a detected Node >= 22.5 runtime
        # when /health does not answer. The runtime script is located relative
        # to this package (../runtime/bin) unless runtimeScriptPath is set.
        autoStartRuntime: true
        # Safest useful capture level: one small audit event per finished turn,
        # no message bodies. off | user-messages | turn-summaries | full
        capturePolicy: turn-summaries
        # Fully automatic memory writing (v0.1.2+):
        #   off | user-messages (save every user message from every DSH session)
        #       | all (user + assistant messages)
        # Captured text is redacted, length-capped and stored only in the local
        # FCA Runtime; every memory is versioned and carries the DSH session id.
        autoMemory: user-messages
        autoMemoryMinChars: 8
        autoMemoryMaxChars: 2000
        autoMemoryMaxPerHour: 120
        autoMemoryMemoryType: episodic
        autoMemoryTags:
          - DSH自动记忆
        # Agent thinking nodes (v0.2, 用户选择“更全”): every finished turn is
        # aggregated into ONE procedural memory with three sections — 关键推理 /
        # 工具执行（名称+参数摘要+结果摘要）/ 结论.  Redacted, length-capped,
        # one memory per (session, turn), bounded by its own hourly limit.
        # off | summary
        autoMemoryAgentNodes: summary
        autoMemoryAgentMaxToolNodes: 8
        autoMemoryAgentReasoningChars: 1500
        autoMemoryAgentConclusionChars: 800
        autoMemoryAgentToolArgChars: 400
        autoMemoryAgentToolResultChars: 600
        autoMemoryAgentMaxChars: 12000
        autoMemoryAgentMaxPerHour: 60
        # Child / subagent session capture (v0.3, 用户要求“跟子agent之间的对话以及
        # 思考过程也得全部写进去”): every child session turn becomes ONE aggregated
        # episodic memory (task / reasoning / tools / result / conclusion) with
        # subagent-session:/parent-session: tags; the parent turn's Agent思考节点
        # gets children:<childId8> tags and a runtime parent→child relation.
        # off | summary
        autoMemorySubagentCapture: summary
        autoMemorySubagentMaxToolNodes: 12
        autoMemorySubagentTaskChars: 1200
        autoMemorySubagentReasoningChars: 1500
        autoMemorySubagentConclusionChars: 800
        autoMemorySubagentResultChars: 1000
        autoMemorySubagentToolArgChars: 400
        autoMemorySubagentToolResultChars: 600
        autoMemorySubagentMaxChars: 12000
        autoMemorySubagentMaxPerHour: 60
        # Context recovery (v0.3, 用户要求“压缩上下文后必须重读记忆节点”):
        # injects an always-on recovery instruction + a post-compaction reminder
        # into the model prompt (systemPrompt section/context) and listens for
        # real compaction/start|summary|end session events. The reminder clears
        # once the agent calls fca_memory_context.
        autoMemoryContextRecovery: true
        autoMemoryContextRecoveryMaxChars: 900
        # Prompt digest injection is opt-in.
        injectContext: false
        # Extra secrets redaction beyond the built-in patterns.
        redactPatterns: []
